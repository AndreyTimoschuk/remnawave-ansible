# ============================================================================
# Пример файла inventory для RemnaWave
# ============================================================================
# Скопируйте этот файл как inventory.ini и замените значения на свои
# ============================================================================

[nodes]
# Прокси ноды - разместите в разных странах для лучшего покрытия
germany ansible_host=192.0.2.1 ansible_user=root
finland ansible_host=192.0.2.2 ansible_user=root
usa ansible_host=192.0.2.3 ansible_user=root

# Панель управления - должна быть доступна из интернета
panel ansible_host=192.0.2.100 ansible_user=root

[nodes:vars]
# Общие SSH параметры
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Для использования SSH ключа из определенного файла (опционально):
# ansible_ssh_private_key_file=~/.ssh/id_rsa_remnawave

