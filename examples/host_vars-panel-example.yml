---
# ============================================================================
# Пример файла host_vars для панели управления
# ============================================================================
# Скопируйте как host_vars/panel.yml
# ============================================================================

# SECRET_KEY для панельной ноды (если панель тоже работает как нода)
# Получить из панели после добавления ноды "panel"
SECRET_KEY: "eyJub2RlQ2VydFBlbSI6Ii0tLS0tQkVHSU4gQ0VSVElGSUNBVEUtLS0tLS..."

# Основной домен RemnaWave панели
remnawave_panel_domain: "panel.yourdomain.com"

# Домен для Grafana мониторинга
monitoring_domain: "monitoring.yourdomain.com"

# Порт Grafana (по умолчанию 3302)
grafana_port: 3302

# JWT Secrets для RemnaWave панели
# Генерация: openssl rand -hex 64
jwt_auth_secret: "CHANGE_ME_64_HEX_CHARS_JWT_AUTH_SECRET_HERE_USE_OPENSSL_RAND_HEX_64"
# Генерация: openssl rand -hex 64
jwt_api_tokens_secret: "CHANGE_ME_64_HEX_CHARS_JWT_API_TOKENS_SECRET_HERE_USE_OPENSSL_RAND_HEX_64"

# PostgreSQL настройки (можно переопределить для панели)
postgres_user: "remnawave"
# Генерация пароля: openssl rand -base64 24
postgres_password: "CHANGE_ME_SECURE_PASSWORD"
postgres_db: "remnawave"

# Домен для публичных подписок (если не указано, используется remnawave_panel_domain)
# Можно оставить пустым или не указывать - будет использован remnawave_panel_domain
# sub_public_domain: "sub.yourdomain.com"

