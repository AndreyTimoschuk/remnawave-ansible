# ============================================================================
# Ansible Inventory для RemnaWave нод
# ============================================================================
# Формат: hostname ansible_host=IP_ADDRESS ansible_user=USERNAME
# Замените IP адреса и имена пользователей на свои
# ============================================================================

[nodes]
# Пример нод для развертывания RemnaNode
node1 ansible_host=192.0.2.1 ansible_user=admin


# Панель RemnaWave
panel ansible_host=192.0.2.100 ansible_user=admin

[nodes:vars]
# Общие переменные для всех нод
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
