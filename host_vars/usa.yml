# ============================================================================
# Host-specific variables for RemnaWave node: usa
# ============================================================================

# SECRET_KEY получается из RemnaWave панели после добавления ноды
# 1. Зайти в панель: https://panel.yourdomain.com
# 2. Добавить ноду в разделе "Nodes"
# 3. Скопировать SECRET_KEY
# 4. Вставить сюда
SECRET_KEY: "CHANGE_ME_SECRET_KEY_FROM_PANEL"

# Опционально: Переопределить порт приложения для конкретной ноды
# app_port: 3333

