---
# ============================================================================
# Плейбук для развертывания системы мониторинга
# ============================================================================
# Описание: Устанавливает Prometheus, Grafana, Node Exporter и Xray Checker
# Запуск: ansible-playbook -i inventory.ini monitoring.yml --limit panel
# ============================================================================

- name: Настройка системы мониторинга RemnaWave
  hosts: panel
  become: yes
  gather_facts: yes
  
  vars:
    # Grafana настройки
    grafana_port: 3302
    
  tasks:
    # ============================================================================
    # БЛОК 1: ПОДГОТОВКА СИСТЕМЫ
    # ============================================================================
    
    - name: Создать директории для мониторинга
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: /opt/monitoring }
        - { path: /var/lib/monitoring/prometheus/data, owner: '65534', group: '65534', mode: '0755' }
        - { path: /var/lib/monitoring/grafana/data, owner: '472', group: '472', mode: '0755' }
        - { path: /var/log/prometheus }
        - { path: /var/log/grafana }
      tags:
        - setup
        - directories

    - name: Исправить права на директорию Prometheus (если уже существует)
      file:
        path: /var/lib/monitoring/prometheus/data
        owner: '65534'
        group: '65534'
        mode: '0755'
        recurse: yes
      tags:
        - setup
        - directories

    - name: Исправить права на директорию Grafana (если уже существует)
      file:
        path: /var/lib/monitoring/grafana/data
        owner: '472'
        group: '472'
        mode: '0755'
        recurse: yes
      tags:
        - setup
        - directories

    - name: Установить logrotate для управления логами мониторинга
      apt:
        name: logrotate
        state: present
        update_cache: yes
      tags:
        - logrotate
        - maintenance

    - name: Установить конфигурацию logrotate для логов мониторинга
      template:
        src: logrotate-custom.j2
        dest: /etc/logrotate.d/monitoring-logs
        owner: root
        group: root
        mode: '0644'
      tags:
        - logrotate
        - maintenance

    # ============================================================================
    # БЛОК 2: КОНФИГУРАЦИОННЫЕ ФАЙЛЫ
    # ============================================================================

    - name: Создать конфигурацию Prometheus
      template:
        src: templates/prometheus.yml.j2
        dest: /opt/monitoring/prometheus.yml
        owner: root
        group: root
        mode: '0644'
      tags:
        - config
        - prometheus

    - name: Создать docker-compose.yml для мониторинга
      template:
        src: templates/monitoring-compose.yml.j2
        dest: /opt/monitoring/docker-compose.yml
        owner: root
        group: root
        mode: '0644'
      tags:
        - config
        - docker

    # ============================================================================
    # БЛОК 3: ЗАПУСК СЕРВИСОВ
    # ============================================================================

    - name: Запустить систему мониторинга
      community.docker.docker_compose_v2:
        project_src: /opt/monitoring
        state: present
      tags:
        - services
        - monitoring

    # ============================================================================
    # БЛОК 4: ПРОВЕРКА РАБОТОСПОСОБНОСТИ
    # ============================================================================

    - name: Дождаться запуска Prometheus
      wait_for:
        host: 127.0.0.1
        port: 9090
        delay: 5
        timeout: 60
        state: started
      tags:
        - verification

    - name: Дождаться запуска Grafana
      wait_for:
        host: 127.0.0.1
        port: "{{ grafana_port }}"
        delay: 5
        timeout: 60
        state: started
      tags:
        - verification

    - name: Показать URL для доступа к сервисам
      debug:
        msg:
          - "Grafana доступна по адресу: https://{{ monitoring_domain }}"
          - "!!! ВАЖНО: Не забудьте настроить Grafana data source для Prometheus: http://127.0.0.1:9090"
      tags:
        - verification

